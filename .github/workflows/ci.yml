name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...
      - name: Cross-compile check for Windows (arm64)
        if: matrix.os == 'ubuntu-latest'
        run: GOOS=windows GOARCH=arm64 go vet ./... && GOOS=windows GOARCH=arm64 go build ./...

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Wake request reaches Windows
        shell: pwsh
        run: ./scripts/windows-smoke.ps1
